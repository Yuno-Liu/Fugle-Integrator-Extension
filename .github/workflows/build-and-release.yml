name: Build and Release Fugle Integrator Extension

on:
  push:
    tags:
      - "v*"
      - "fugle-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (optional when manual run)"
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Determine Version
        id: config
        run: |
          REF="${{ github.ref_name }}"
          MANUAL_TAG="${{ inputs.tag_name }}"

          if [ -n "$MANUAL_TAG" ]; then
            TAG="$MANUAL_TAG"
          elif [ -n "$REF" ]; then
            TAG="$REF"
          else
            TAG="v$(date +'%Y%m%d%H%M%S')"
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Package Extension
        run: |
          TAG="${{ steps.config.outputs.release_tag }}"
          mkdir -p releases
          zip -r releases/FugleIntegrator-$TAG.zip dist/ manifest.json stock-data.json options.html README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FugleIntegrator-${{ steps.config.outputs.release_tag }}
          path: releases/*.zip

      - name: Generate Release Notes
        run: |
          TAG="${{ steps.config.outputs.release_tag }}"
          cat << 'EOF' > release_body.md
          ## 富果整合器 (Fugle Integrator) - $TAG

          ### 📦 發布套件
          - **FugleIntegrator-$TAG.zip** - 富果整合器 Chrome 擴充功能主套件

          ### 🚀 安裝說明
          1. 下載 `FugleIntegrator-$TAG.zip`
          2. 解壓縮檔案至本機資料夾
          3. 開啟 Google Chrome 瀏覽器，進入 `chrome://extensions/`
          4. 開啟右上角 **「開發人員模式」 (Developer mode)**
          5. 點選 **「載入未封裝項目」 (Load unpacked)** 並選取解壓縮後的 `dist` 目錄

          ---
          *由 GitHub Actions 自動建置發布*
          EOF
          sed -i "s/\$TAG/$TAG/g" release_body.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.config.outputs.release_tag }}
          name: Release ${{ steps.config.outputs.release_tag }}
          body_path: release_body.md
          files: releases/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
