name: Build and Release Fugle Integrator Extension

on:
  push:
    tags:
      - "v*"
      - "fugle-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "發布標籤，例如 v2.1.0（須與 package.json 的 version 相同）"
        required: true
        type: string

# 預設只有讀取權限；只有最後建立 Release 的 job（不執行任何 npm 套件程式碼）才有寫入權限
permissions:
  contents: read

jobs:
  build:
    name: Verify & build
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.config.outputs.release_tag }}
      version: ${{ steps.config.outputs.version }}
      # 實際建置的 commit；手動發布建立新標籤時必須指向它
      sha: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      # 📌 使用者輸入一律經由環境變數傳入，避免直接展開到 shell 指令中
      - name: Determine and validate version
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^(fugle-)?v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::標籤格式須為 v1.2.3（收到：'$TAG'）"
            exit 1
          fi
          VERSION="${TAG#fugle-}"
          VERSION="${VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::標籤版本 $VERSION 與 package.json 版本 $PKG_VERSION 不一致，請先更新 package.json"
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests
        run: npm test

      - name: Build extension
        run: npm run build

      # zip 根目錄即為擴充功能資料夾（manifest.json 在最上層），解壓縮後可直接載入
      - name: Package extension
        env:
          TAG: ${{ steps.config.outputs.release_tag }}
        run: |
          mkdir -p releases
          (cd dist && zip -r "../releases/FugleIntegrator-$TAG.zip" .)
          unzip -l "releases/FugleIntegrator-$TAG.zip"

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: releases/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: releases

      # download-artifact v8 只在判斷為 zip 時才解壓縮，否則會把整個 artifact 存成一個檔案（檔名仍符合 *.zip）；
      # 發布前確認拿到的正是建置產生的發布檔
      - name: Verify package
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          ls -l releases
          if [ "$(ls releases)" != "FugleIntegrator-$TAG.zip" ]; then
            echo "::error::releases/ 應只有 FugleIntegrator-$TAG.zip"
            exit 1
          fi

      - name: Generate release notes
        env:
          TAG: ${{ needs.build.outputs.release_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cat > release_body.md <<EOF
          ## 富果整合器 (Fugle Integrator) v${VERSION}

          ### 📦 發布套件
          - **FugleIntegrator-${TAG}.zip**：Chrome 擴充功能（Manifest V3）

          ### 🚀 安裝說明
          1. 下載 \`FugleIntegrator-${TAG}.zip\` 並解壓縮到任意資料夾
          2. 開啟 Chrome，進入 \`chrome://extensions/\`
          3. 開啟右上角的 **「開發人員模式」**
          4. 點選 **「載入未封裝項目」**，選取剛剛解壓縮的資料夾（資料夾內可看到 \`manifest.json\`）

          > 從舊版更新後，請重新整理已開啟的富果分頁。

          ---
          *由 GitHub Actions 自動建置發布*
          EOF

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: Release ${{ needs.build.outputs.release_tag }}
          body_path: release_body.md
          files: releases/*.zip
          # 找不到發布檔時讓 job 失敗，而不是發布沒有附檔的 Release
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
