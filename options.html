<!doctype html>
<html lang="zh-Hant">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>富果整合器設定</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                margin: 24px;
                background: #1f1f1f;
                color: #f5f5f5;
            }
            .card {
                max-width: 540px;
                border: 1px solid #333;
                border-radius: 12px;
                padding: 20px;
                background: #2b2b2b;
            }
            label {
                display: block;
                margin-bottom: 8px;
                font-weight: 600;
            }
            input {
                width: 100%;
                box-sizing: border-box;
                border: 1px solid #444;
                border-radius: 8px;
                padding: 10px 12px;
                background: #1b1b1b;
                color: #fff;
                font-size: 16px;
            }
            .actions {
                margin-top: 12px;
                display: flex;
                gap: 8px;
            }
            button {
                border: none;
                border-radius: 8px;
                padding: 10px 14px;
                cursor: pointer;
                font-weight: 600;
            }
            #save-shortcut-btn {
                background: #6366f1;
                color: #fff;
            }
            #reset-shortcut-btn {
                background: #3a3a3a;
                color: #ddd;
            }
            #shortcut-status {
                margin-top: 10px;
                color: #9fd39f;
                min-height: 20px;
            }
            .hint {
                margin-top: 8px;
                color: #b4b4b4;
                font-size: 13px;
                line-height: 1.4;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>⌨️ 快速定位設定</h1>
            <p>快速定位到 <code>id="ember14"</code> 輸入框。預設快捷鍵：<strong>Alt+Q</strong></p>

            <label for="shortcut-input">自訂快捷鍵</label>
            <input id="shortcut-input" type="text" placeholder="點這裡後按下組合鍵，例如 Alt+Q" />
            <div class="actions">
                <button id="save-shortcut-btn">儲存</button>
                <button id="reset-shortcut-btn">重設為 Alt+Q</button>
            </div>
            <div id="shortcut-status"></div>
            <div class="hint">請至少包含一個修飾鍵（Ctrl / Alt / Shift / Meta）。</div>
        </div>

        <script src="options.js"></script>
    </body>
</html>
